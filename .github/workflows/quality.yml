name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: homecareos
          POSTGRES_PASSWORD: homecareos
          POSTGRES_DB: homecareos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homecareos -d homecareos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://homecareos:homecareos@localhost:5432/homecareos

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.17"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      - name: pytest
        run: uv run pytest
