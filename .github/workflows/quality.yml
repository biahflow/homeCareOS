name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: homecareos
          POSTGRES_PASSWORD: homecareos
          POSTGRES_DB: homecareos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homecareos -d homecareos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://homecareos:homecareos@localhost:5432/homecareos

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.17"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      - name: seed de operadoras
        run: uv run python -m homecareos.seed

      - name: pytest
        run: uv run pytest

  # Job independente do `api`: o front não precisa de Postgres nem de Python, e
  # uma falha de um lado não deve mascarar o outro. Ainda não há framework de
  # teste no front — os portões aqui são lint, tipos e build.
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # `apps/web/package.json` exige `>=22.13.0` em `engines`.
          node-version: "22"
          cache: npm

      # Na raiz, não em `apps/web`: o lockfile é do workspace inteiro e o app
      # depende de `packages/contracts`.
      - name: npm ci
        run: npm ci

      - name: eslint
        run: npm run lint -w apps/web

      - name: tsc apps/web
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: tsc packages/contracts
        run: npx tsc --noEmit -p packages/contracts/tsconfig.json

      - name: next build
        run: npm run build -w apps/web
