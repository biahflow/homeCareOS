[project]
name = "homecareos-api"
version = "0.1.0"
description = "HomeCareOS API — conferência pré-faturamento de evoluções de prontuário."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  # Upload multipart das evoluções escaneadas (trilha de intake).
  "python-multipart>=0.0.20,<1",
  # Leitura/renderização de PDF para conferência visual (trilha de extração).
  "pymupdf>=1.26,<2",
  # Cliente S3/MinIO para o storage de documentos (trilha de storage).
  "boto3>=1.40,<2",
  # Extração assistida por IA das evoluções (trilha de extração).
  "anthropic>=0.40,<1",
  # Cliente HTTP do gateway de WhatsApp que envia os alertas (trilha de
  # alertas). Sai do grupo `dev` — onde entrara só para o TestClient do
  # FastAPI — porque agora é dependência de runtime da aplicação.
  "httpx>=0.28,<1",
  # Hash de senha de usuário (Argon2id, issue #30). Senha escolhida por pessoa
  # exige função lenta e com sal — o `hmac.compare_digest` de `api/auth.py`
  # resolve o problema oposto (segredo de máquina, de alta entropia).
  "argon2-cffi>=23.1,<25",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "types-boto3>=1.40,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homecareos"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"
markers = [
  # Testes que exigem Postgres e MinIO de verdade (`docker compose up -d`).
  # Eles se pulam sozinhos quando os serviços não respondem, para a suíte
  # continuar utilizável sem container; a marca existe para poder selecioná-los
  # (`-m integration`) ou excluí-los (`-m 'not integration'`) explicitamente.
  "integration: requer Postgres e MinIO reais",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz", "boto3.*", "botocore.*"]
ignore_missing_imports = true
