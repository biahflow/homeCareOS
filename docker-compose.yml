services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: homecareos
      POSTGRES_PASSWORD: homecareos
      POSTGRES_DB: homecareos
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecareos -d homecareos"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria o bucket de documentos uma vez e sai. Não é um serviço de longa
  # duração, então não entra em `profiles` — precisa rodar em todo `up`.
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/homecareos-documentos
      "

  api:
    build:
      context: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://homecareos:homecareos@postgres:5432/homecareos
      S3_ENDPOINT_URL: http://minio:9000
      # O Dockerfile instala o pacote com `--no-editable`, isto é, copiado para
      # dentro do venv. Sem isto o volume de código abaixo não teria efeito
      # nenhum e o `--reload` seria uma ilusão: o container seguiria rodando a
      # cópia congelada na imagem.
      PYTHONPATH: /app/src
    ports:
      - "${API_PORT:-8001}:8000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/uv.lock:/app/uv.lock:ro
    command: uvicorn homecareos.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Ferramentas de operação, não sobem com `docker compose up`. Rodam sob
  # demanda com `docker compose run --rm api-migrate` / `api-seed` — não há
  # migration nem seed neste estágio da fundação, e sem `profiles` o
  # `docker compose up` tentaria rodá-los e falharia.
  api-migrate:
    build:
      context: ./apps/api
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://homecareos:homecareos@postgres:5432/homecareos
      # Mesma razão do comentário de PYTHONPATH no serviço `api`: o pacote é
      # instalado com `--no-editable` (copiado para dentro do venv), então
      # sem isto o volume de `src` abaixo não teria efeito nenhum — o
      # container seguiria rodando a cópia congelada na imagem.
      PYTHONPATH: /app/src
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/uv.lock:/app/uv.lock:ro
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api-seed:
    build:
      context: ./apps/api
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://homecareos:homecareos@postgres:5432/homecareos
      S3_ENDPOINT_URL: http://minio:9000
      PYTHONPATH: /app/src
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/uv.lock:/app/uv.lock:ro
    command: python -m homecareos.seed
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Varredura de alertas (issue #9). Envia pelos canais ligados em
  # ALERTAS_CANAIS — WhatsApp e/ou e-mail, ADR 0006. Fica em `profiles: ["tools"]`
  # como as demais ferramentas: em produção quem a chama é um cron
  # (`docker compose run --rm api-alertas`), não o `up`. Sai com código 1 só
  # quando a configuração de alertas está quebrada — é isso que o cron monitora.
  api-alertas:
    build:
      context: ./apps/api
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://homecareos:homecareos@postgres:5432/homecareos
      PYTHONPATH: /app/src
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/uv.lock:/app/uv.lock:ro
    command: python -m homecareos.alerts.scan
    depends_on:
      postgres:
        condition: service_healthy

  # Expurgo por retenção de tentativas_login, tokens_recuperacao e
  # alertas_enviados (issue #39). Fica em `profiles: ["tools"]` como as demais
  # ferramentas: em produção quem a chama é um cron (`docker compose run --rm
  # api-retencao ...`), não o `up`. O comando default roda em dry-run (não
  # apaga nada); apagar de verdade exige sobrescrever o command com
  # `--executar` — ver "Retenção e expurgo de dados" no README de apps/api.
  api-retencao:
    build:
      context: ./apps/api
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://homecareos:homecareos@postgres:5432/homecareos
      PYTHONPATH: /app/src
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/uv.lock:/app/uv.lock:ro
    command: python -m homecareos.retencao.cli
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend Next.js. A URL da API é configuração de **runtime do servidor**
  # (`API_URL`), não argumento de build: com o proxy do ADR 0002 quem chama a
  # API é o servidor do Next, e o navegador só fala com a origem do próprio
  # front.
  #
  # Por isso `http://api:8000` e não `http://localhost:8001`: a chamada sai de
  # dentro da rede do Compose, de container para container, então usa o nome do
  # serviço e a porta **interna** — não depende da porta publicada no host nem
  # de `API_PORT`.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
